<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JY AI 资源站 · 免费 API 与工具选型中心</title>
  <meta name="description" content="面向 AI 选型场景的免费 API 额度中心：白嫖指数评分、数据合规筛选、场景直达、并排对比。" />
  <meta name="keywords" content="AI API,免费API,大模型,白嫖指数,GPT,DeepSeek,Gemini" />
  <meta name="author" content="JY AI 资源站" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="color-scheme" content="dark light" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="JY AI 资源站 · 免费 API 选型中心" />
  <meta property="og:description" content="白嫖指数评分、数据合规筛选、场景直达的 AI 工具选型平台。" />
  <meta property="og:locale" content="zh_CN" />

  <!-- 预连接字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="assets/css/main.css" />

  <!-- SVG 品牌图标 -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='48' y2='48' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0' stop-color='%234f8fff'/%3E%3Cstop offset='1' stop-color='%2300e5c8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3Ctext x='24' y='33' font-size='18' text-anchor='middle' fill='white' font-family='system-ui,sans-serif' font-weight='800'%3EJY%3C/text%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='48' y2='48'%3E%3Cstop offset='0' stop-color='%234f8fff'/%3E%3Cstop offset='1' stop-color='%2300e5c8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='48' height='48' rx='12' fill='url(%23g)'/%3E%3C/svg%3E" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/home" data-nav="home">
        <span class="brand-mark">JY</span>
        <span class="brand-text">JY AI 资源站</span>
        <span class="brand-tag">免费额度 · 数据合规 · 场景直达</span>
      </a>
      <nav class="nav">
        <a class="nav-link" href="#/home" data-nav="home">首页</a>
        <a class="nav-link" href="#/catalog" data-nav="catalog">API 目录</a>
        <a class="nav-link" href="#/news" data-nav="news">资讯流</a>
        <a class="nav-link" href="#/tools" data-nav="tools">工具导航</a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" title="切换深浅色 (t)" aria-label="切换主题">
          <svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
          <svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
        </button>
        <button class="icon-btn" id="helpBtn" title="快捷键 (?)" aria-label="快捷键帮助">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 .9-1 1.7M12 17h.01"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" class="view"><!-- rendered by app.js --></main>

  <footer class="footer">
    <div class="footer-inner">
      <span id="builtAt">数据构建中…</span>
      <span class="footer-note">白嫖指数由前端按公开规则实时计算，可解释、可复核 · 所有数据本地静态托管</span>
    </div>
  </footer>

  <!-- 详情抽屉 -->
  <div class="drawer-scrim" id="drawerScrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-hidden="true">
    <div class="drawer-head">
      <span id="drawerTitle" class="drawer-title"></span>
      <button class="icon-btn" id="drawerClose" aria-label="关闭">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- 对比托盘 -->
  <div class="compare-tray" id="compareTray" hidden>
    <div class="compare-tray-inner">
      <span class="compare-count" id="compareCount">已选 0 项</span>
      <div class="compare-chips" id="compareChips"></div>
      <div class="compare-actions">
        <button class="btn ghost sm" id="compareClear">清空</button>
        <button class="btn primary sm" id="compareOpen">并排对比</button>
      </div>
    </div>
  </div>

  <!-- 快捷键帮助 -->
  <div class="modal-scrim" id="helpScrim" hidden></div>
  <div class="modal" id="helpModal" hidden>
    <div class="modal-head"><span>键盘快捷键</span><button class="icon-btn" id="helpClose">✕</button></div>
    <div class="modal-body" id="helpBody"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <script src="assets/data/catalog.js"></script>
  <script src="assets/data/news.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
